<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My GitHub Portfolio</title>
  <style>
    :root {
      --primary: #6366f1;
      --secondary: #a855f7;
      --accent: #ec4899;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, 
        rgba(99, 102, 241, 0.1) 0%, 
        rgba(168, 85, 247, 0.1) 50%, 
        rgba(236, 72, 153, 0.1) 100%);
      position: relative;
      overflow-x: hidden;
    }

    .background-effect {
      position: fixed;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 50%, 
        rgba(99, 102, 241, 0.15) 0%, 
        transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    h1 {
      text-align: center;
      padding: 2rem 0;
      font-size: 3.5rem;
      position: relative;
      text-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      background: linear-gradient(45deg, 
        var(--primary), 
        var(--secondary), 
        var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: gradientAnimation 5s ease infinite;
    }

    @keyframes gradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h1::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 60%;
      height: 4px;
      background: linear-gradient(45deg, 
        var(--primary), 
        var(--secondary), 
        var(--accent));
      transform: translateX(-50%);
      border-radius: 2px;
      animation: underlineAnimation 3s ease-in-out infinite;
    }

    @keyframes underlineAnimation {
      0% { width: 60%; }
      50% { width: 80%; }
      100% { width: 60%; }
    }

    #repo-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
    }

    .repo {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 1.5rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
                  0 2px 4px -1px rgba(0, 0, 0, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.3);
      transform: translateY(0);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .repo:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1),
                  0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    .repo::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, 
        transparent 0%, 
        rgba(99, 102, 241, 0.1) 50%, 
        transparent 100%);
      animation: rotate 6s linear infinite;
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .repo h3 {
      margin: 0 0 1rem;
      color: #1f2937;
      font-size: 1.25rem;
      position: relative;
    }

    .repo button {
      padding: 0.75rem 1.5rem;
      border: none;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .repo button:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.3),
                  0 2px 4px -1px rgba(168, 85, 247, 0.3);
    }

    @media (max-width: 768px) {
      #repo-list {
        grid-template-columns: 1fr;
        padding: 1rem;
      }
      
      h1 {
        font-size: 2.5rem;
      }
    }
  </style>
  <!-- Add Poppins font from Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background-effect"></div>
  <h1>sedea1386's Work of CS</h1>
  <div id="repo-list">
    <!-- Repository cards will be inserted here -->
  </div>

  <script>
    const username = "sbyoun3";
    const apiUrl = `https://api.github.com/users/${username}/repos`;

    async function fetchRepos() {
      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
        const repos = await response.json();
        displayRepos(repos);
      } catch (error) {
        console.error('Error:', error);
      }
    }

    function displayRepos(repos) {
      const repoList = document.getElementById("repo-list");
      repos.sort((a, b) => a.name.localeCompare(b.name));

      repos.forEach(repo => {
        const repoDiv = document.createElement("div");
        repoDiv.className = "repo";
        
        const repoName = document.createElement("h3");
        repoName.textContent = repo.name;
        
        const repoButton = document.createElement("button");
        repoButton.textContent = "View Repository";
        repoButton.onclick = () => window.open(repo.html_url, '_blank');

        repoDiv.appendChild(repoName);
        repoDiv.appendChild(repoButton);
        repoList.appendChild(repoDiv);
      });
    }

    document.addEventListener("DOMContentLoaded", fetchRepos);
  </script>
</body>
</html>
